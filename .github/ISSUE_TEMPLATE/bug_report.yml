name: Bug Report
description: Report a bug in update scripts or workflow execution
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify the issue is reproducible before opening a ticket.
        For security issues, refer to [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a concise description of the observed defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands or actions triggering the issue.
      placeholder: |
        1. Run python3 .github/scripts/update_latest_projects.py
        2. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what should have occurred.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant terminal output or traceback.
      render: shell
